<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sistem Administrasi NU Baleharjo</title>
<meta name="robots" content="noindex, nofollow">
<!-- Ikon aplikasi: href diisi otomatis oleh script di bawah (dari ?rpc=getIkon), dan di-cache di browser agar muncul instan. -->
<link rel="icon" id="appFaviconLink" href="">
<link rel="apple-touch-icon" id="appTouchIconLink" href="">
<link rel="manifest" id="appManifestLink" href="">
<meta name="theme-color" content="#0f3d24">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; overflow: hidden; background: #0f3d24; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
  #app-frame { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; display: block; background: #fff; }

  #nuSplash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% 36%,#1d5c3b 0%,#123d27 55%,#0b2a1b 100%);transition:opacity .5s ease,visibility .5s ease;}
  #nuSplash.nu-hide{opacity:0;visibility:hidden;pointer-events:none;}
  #nuSplash .nu-logo{width:auto;height:auto;min-height:104px;display:flex;align-items:center;justify-content:center;animation:nuDenyut 2.2s ease-in-out infinite;}
  #nuSplash .nu-logo img{width:auto;height:auto;max-width:min(190px,56vw);max-height:130px;object-fit:contain;display:none;filter:drop-shadow(0 8px 22px rgba(0,0,0,.35));}
  #nuSplash .nu-mono{font-size:46px;font-weight:800;color:#fff;letter-spacing:1px;}
  #nuSplash .nu-sapa{margin-top:26px;font-size:clamp(26px,6vw,38px);font-weight:700;letter-spacing:.3px;}
  #nuSplash .nu-app{margin-top:6px;font-size:clamp(14px,3.6vw,18px);line-height:1.5;opacity:.92;}
  #nuSplash .nu-app b{display:inline-block;margin-top:2px;font-size:clamp(18px,4.6vw,24px);color:#e3c25a;letter-spacing:.4px;}
  #nuSplash .nu-bar{width:min(320px,76vw);height:8px;margin-top:30px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;}
  #nuSplash .nu-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#c9a227,#f0d77a);transition:width .25s ease-out;}
  #nuSplash .nu-pct{margin-top:12px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  #nuSplash .nu-info{margin-top:2px;font-size:13px;opacity:.75;min-height:18px;}
  #nuSplash .nu-tag{position:absolute;left:0;right:0;bottom:22px;font-size:12px;letter-spacing:.8px;opacity:.55;}
  @keyframes nuDenyut{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  @media (prefers-reduced-motion:reduce){#nuSplash .nu-logo{animation:none;}}

  #nuSplash .nu-buka{margin-top:18px;font-size:13px;color:#f0d77a;text-decoration:underline;display:none;}
</style>
</head>
<body>

  <!-- Aplikasi dimuat sejak awal di belakang splash -->
  <iframe id="app-frame" title="Sistem Administrasi NU Baleharjo" allow="clipboard-write"></iframe>

  <div id="nuSplash" role="status" aria-live="polite">
    <div class="nu-logo">
      <img id="nuSplashLogo" alt="Logo NU">
      <div class="nu-mono" id="nuSplashMono">NU</div>
    </div>
    <div class="nu-sapa">Selamat Datang</div>
    <div class="nu-app">di Sistem Administrasi<br><b>NU Baleharjo</b></div>
    <div class="nu-bar"><i id="nuSplashBar"></i></div>
    <div class="nu-pct"><span id="nuSplashPct">0</span>%</div>
    <div class="nu-info" id="nuSplashInfo">Menghubungkan ke server...</div>
    <a class="nu-buka" id="nuBukaLangsung" href="#">Tidak terbuka? Klik di sini</a>
    <div class="nu-tag">Merawat Jagat Membangun Peradaban</div>
  </div>

<script>
  var GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwSK9pZh5H18yFqpsTmY29GqoUIeE1HcRUzuVKt8o8OVfIyflLz8AT6jaWZ2bHWp-bUFQ/exec";
  var TIMEOUT_MS = 12000; // jika iframe belum mulai terhubung dalam 12 detik, muat ulang otomatis

  var frame = document.getElementById('app-frame');
  var splash = document.getElementById('nuSplash');
  var elPct = document.getElementById('nuSplashPct'), elBar = document.getElementById('nuSplashBar'),
      elInfo = document.getElementById('nuSplashInfo'), elLogo = document.getElementById('nuSplashLogo'),
      elMono = document.getElementById('nuSplashMono'), elBuka = document.getElementById('nuBukaLangsung');
  var MIN_TAMPIL = 800, TUNGGU_SINYAL = 20000, MAKS_TUNGGU = 45000, KUNCI_LOGO = 'nuSplashLogoNU';
  var mulai = Date.now(), target = 0, tampil = 0, iframeMuat = false, waktuIframe = 0, siap = false, selesai = false;

  elBuka.href = GAS_WEB_APP_URL;
  frame.addEventListener('load', function () { if (!iframeMuat) { iframeMuat = true; waktuIframe = Date.now(); } });
  frame.src = GAS_WEB_APP_URL;

  // Muat ulang otomatis bila iframe tak kunjung terhubung
  setTimeout(function () {
    if (!iframeMuat) { elInfo.textContent = 'Menghubungkan ulang...'; setTimeout(function () { window.location.reload(); }, 600); }
  }, TIMEOUT_MS);

  // ================= IKON / LOGO =================
  function setIkon(url) {
    if (!url) return;
    document.getElementById('appFaviconLink').setAttribute('href', url);
    document.getElementById('appTouchIconLink').setAttribute('href', url);
    var manifest = {
      name: 'Sistem Administrasi NU Baleharjo', short_name: 'SI ADMIN NU',
      start_url: GAS_WEB_APP_URL, display: 'standalone',
      background_color: '#0f3d24', theme_color: '#0f3d24',
      icons: [ { src: url, sizes: '192x192', type: 'image/png' }, { src: url, sizes: '512x512', type: 'image/png' } ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    document.getElementById('appManifestLink').setAttribute('href', URL.createObjectURL(blob));
  }
  // Logo splash = logo NU di bar atas aplikasi (dikirim aplikasi, lalu di-cache agar instan di kunjungan berikutnya)
  function setLogoNU(src) {
    if (!src || elLogo.getAttribute('src') === src) return;
    elLogo.onload = function () { elLogo.style.display = 'block'; elMono.style.display = 'none'; };
    elLogo.onerror = function () { elLogo.style.display = 'none'; elMono.style.display = ''; };
    elLogo.src = src;
  }
  try { setLogoNU(localStorage.getItem(KUNCI_LOGO)); } catch (e) {}
  try { setIkon(localStorage.getItem('nuIkonApp')); } catch (e) {}
  // 2) dari server (paralel dengan pemuatan aplikasi) -> perbarui bila berubah
  fetch(GAS_WEB_APP_URL + '?rpc=getIkon')
    .then(function (r) { return r.json(); })
    .then(function (res) {
      var url = res && res.url;
      if (!url) return;
      setIkon(url);
      try { localStorage.setItem('nuIkonApp', url); } catch (e) {}
    })
    .catch(function () {});

  // ================= SINYAL DARI APLIKASI =================
  window.addEventListener('message', function (e) {
    var d = e && e.data;
    if (d === 'nu-app-ready') siap = true;
    else if (d && typeof d === 'object' && d.nu === 'logo' && typeof d.src === 'string' && /^(data:image\/|https:\/\/)/.test(d.src)) {
      setLogoNU(d.src);
      try { localStorage.setItem(KUNCI_LOGO, d.src); } catch (x) {}
    }
  });

  // ================= SPLASH =================
  function tulis(p) {
    elPct.textContent = p; elBar.style.width = p + '%';
    elInfo.textContent = p >= 100 ? 'Selesai' : p < 30 ? 'Menghubungkan ke server...' : p < 70 ? 'Memuat data...' : 'Menyiapkan tampilan...';
  }
  function tutup() {
    if (selesai) return;
    selesai = true; clearInterval(timer);
    tulis(100);
    splash.classList.add('nu-hide');
    setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 700);
  }
  function langkah() {
    if (selesai) return;
    var lama = Date.now() - mulai;
    if (iframeMuat && !siap && Date.now() - waktuIframe > TUNGGU_SINYAL) siap = true; // aplikasi versi lama tanpa sinyal
    if (lama > 12000 && !siap) elBuka.style.display = 'inline';
    if (siap) target = 100;
    else if (iframeMuat) target = Math.min(95, Math.max(target, 70) + 0.25);
    else target = Math.min(68, target + (68 - target) * 0.03 + 0.15);
    tampil += (target - tampil) * (siap ? 0.45 : 0.2);
    if (target - tampil < 0.5) tampil = target;
    tulis(Math.floor(tampil));
    if (siap && tampil >= 99.5 && lama >= MIN_TAMPIL) tutup();
    else if (lama > MAKS_TUNGGU) tutup();
  }
  var timer = setInterval(langkah, 100);
</script>

</body>
</html>
