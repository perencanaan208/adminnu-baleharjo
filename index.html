<!-- =====================================================================
  SPLASH "SELAMAT DATANG" ADMIN NU BALEHARJO
  Tempel SELURUH blok ini di index.html Vercel, TEPAT SEBELUM </body>.
  Tidak perlu menghapus apa pun: layar ini menutupi pemuat lama, lalu
  hilang sendiri saat aplikasi Apps Script siap, sehingga aplikasi
  langsung terbuka. Logo diambil otomatis dari ikon (favicon) halaman.
====================================================================== -->
<style id="nuSplashCss">
  #nuSplash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% 36%,#1d5c3b 0%,#123d27 55%,#0b2a1b 100%);transition:opacity .5s ease,visibility .5s ease;}
  #nuSplash.nu-hide{opacity:0;visibility:hidden;pointer-events:none;}
  #nuSplash .nu-logo{width:104px;height:104px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 34px rgba(0,0,0,.35),0 0 0 6px rgba(201,162,39,.35);animation:nuDenyut 2.2s ease-in-out infinite;overflow:hidden;}
  #nuSplash .nu-logo img{width:84px;height:84px;object-fit:contain;display:none;}
  #nuSplash .nu-mono{font-size:38px;font-weight:800;color:#14532d;letter-spacing:1px;}
  #nuSplash .nu-sapa{margin-top:26px;font-size:clamp(26px,6vw,38px);font-weight:700;letter-spacing:.3px;}
  #nuSplash .nu-app{margin-top:6px;font-size:clamp(14px,3.6vw,18px);line-height:1.5;opacity:.92;}
  #nuSplash .nu-app b{display:inline-block;margin-top:2px;font-size:clamp(18px,4.6vw,24px);color:#e3c25a;letter-spacing:.4px;}
  #nuSplash .nu-bar{width:min(320px,76vw);height:8px;margin-top:30px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;}
  #nuSplash .nu-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#c9a227,#f0d77a);transition:width .25s ease-out;}
  #nuSplash .nu-pct{margin-top:12px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  #nuSplash .nu-info{margin-top:2px;font-size:13px;opacity:.75;min-height:18px;}
  #nuSplash .nu-tag{position:absolute;left:0;right:0;bottom:22px;font-size:12px;letter-spacing:.8px;opacity:.55;}
  @keyframes nuDenyut{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  @media (prefers-reduced-motion:reduce){#nuSplash .nu-logo{animation:none;}}
</style>

<div id="nuSplash" role="status" aria-live="polite">
  <div class="nu-logo">
    <img id="nuSplashLogo" alt="Logo NU">
    <div class="nu-mono" id="nuSplashMono">NU</div>
  </div>
  <div class="nu-sapa">Selamat Datang</div>
  <div class="nu-app">di Sistem Administrasi<br><b>NU Baleharjo</b></div>
  <div class="nu-bar"><i id="nuSplashBar"></i></div>
  <div class="nu-pct"><span id="nuSplashPct">0</span>%</div>
  <div class="nu-info" id="nuSplashInfo">Menghubungkan ke server...</div>
  <div class="nu-tag">Merawat Jagat Membangun Peradaban</div>
</div>

<script>
(function () {
  var splash = document.getElementById('nuSplash');
  if (!splash) return;
  var elPct = document.getElementById('nuSplashPct'), elBar = document.getElementById('nuSplashBar'),
      elInfo = document.getElementById('nuSplashInfo'), elLogo = document.getElementById('nuSplashLogo'),
      elMono = document.getElementById('nuSplashMono');
  var MIN_TAMPIL = 1500, MAKS_TUNGGU = 30000, TUNGGU_SINYAL = 8000;
  var mulai = Date.now(), target = 0, tampil = 0, iframeMuat = false, waktuIframe = 0, siap = false, selesai = false, adaIframe = false;

  // Logo: pakai ikon halaman yang sudah dipakai tab browser
  function cariLogo() {
    if (elLogo.getAttribute('src')) return true;
    var l = document.querySelector('link[rel~="icon"][href]') || document.querySelector('link[rel="apple-touch-icon"][href]');
    var h = l && l.getAttribute('href');
    if (!h) return false;
    elLogo.onload = function () { elLogo.style.display = 'block'; elMono.style.display = 'none'; };
    elLogo.src = h;
    return true;
  }

  function pasangIframe() {
    var f = document.querySelector('iframe');
    if (!f) return;
    adaIframe = true;
    if (f.__nuPasang) return;
    f.__nuPasang = true;
    f.addEventListener('load', function () {
      var u = f.getAttribute('src') || '';
      if (!u || u.indexOf('about:blank') === 0) return;
      if (!iframeMuat) { iframeMuat = true; waktuIframe = Date.now(); }
    });
  }

  // Sinyal dari aplikasi Apps Script bahwa tampilan sudah siap
  window.addEventListener('message', function (e) { if (e && e.data === 'nu-app-ready') siap = true; });

  function tulis(p) {
    elPct.textContent = p;
    elBar.style.width = p + '%';
    elInfo.textContent = p >= 100 ? 'Selesai' : p < 30 ? 'Menghubungkan ke server...' : p < 70 ? 'Memuat aplikasi...' : 'Menyiapkan tampilan...';
  }

  function tutup() {
    if (selesai) return;
    selesai = true;
    clearInterval(timer); clearInterval(timerLogo);
    tulis(100);
    splash.classList.add('nu-hide');
    setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 700);
  }

  function langkah() {
    if (selesai) return;
    pasangIframe();
    var lama = Date.now() - mulai;
    if (!adaIframe && lama > 6000) siap = true;               // halaman tanpa iframe: jangan menahan layar
    if (iframeMuat && !siap && Date.now() - waktuIframe > TUNGGU_SINYAL) siap = true;   // aplikasi versi lama tanpa sinyal
    if (siap) target = 100;
    else if (iframeMuat) target = Math.min(95, Math.max(target, 70) + 0.3);
    else target = Math.min(68, target + (68 - target) * 0.03 + 0.15);
    tampil += (target - tampil) * 0.2;
    if (target - tampil < 0.5) tampil = target;
    tulis(Math.floor(tampil));
    if (siap && tampil >= 99.5 && lama >= MIN_TAMPIL) tutup();
    else if (lama > MAKS_TUNGGU) tutup();
  }

  var timer = setInterval(langkah, 100);
  var timerLogo = setInterval(function () { if (cariLogo() || Date.now() - mulai > 10000) clearInterval(timerLogo); }, 250);
  cariLogo();
})();
</script>
