<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Administrasi NU Baleharjo</title>
<meta name="robots" content="noindex, nofollow">
<!--
  Ikon aplikasi: favicon tab browser, ikon Home Screen iOS, dan ikon
  "Buat Pintasan"/"Install" di Android & desktop Chrome. Href-nya SENGAJA
  dikosongkan di sini — begitu halaman ini dimuat, script kecil di bawah
  mengambil URL Icon Aplikasi (yang disimpan di Google Drive lewat menu
  Pengaturan di dalam aplikasi) langsung dari server GAS, lalu mengisi
  href-nya. Jadi kalau Admin ganti ikon lewat Pengaturan, ikon di sini
  IKUT BERUBAH otomatis — TIDAK perlu commit/push apapun ke sini lagi.
-->
<link rel="icon" id="appFaviconLink" href="">
<link rel="apple-touch-icon" id="appTouchIconLink" href="">
<link rel="manifest" id="appManifestLink" href="">
<meta name="theme-color" content="#0f3d24">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; overflow: hidden; background: #0f3d24; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }

  #app-frame { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; display: block; }

  #loader {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #0f3d24; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; color: #fff; z-index: 10;
    transition: opacity 0.3s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  .spinner { width: 42px; height: 42px; border: 4px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader p { font-size: 14px; opacity: 0.85; }
</style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p id="loaderText">Memuat Sistem Administrasi NU Baleharjo...</p>
  </div>

  <iframe id="app-frame" title="Sistem Administrasi NU Baleharjo" allow="clipboard-write"></iframe>

<script>
  var GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwSK9pZh5H18yFqpsTmY29GqoUIeE1HcRUzuVKt8o8OVfIyflLz8AT6jaWZ2bHWp-bUFQ/exec";
  var TIMEOUT_MS = 10000; // kalau belum kelar dalam 10 detik, otomatis reload

  var frame = document.getElementById('app-frame');
  var loader = document.getElementById('loader');
  var loaderText = document.getElementById('loaderText');

  frame.src = GAS_WEB_APP_URL;

  var loaded = false;
  frame.addEventListener('load', function () {
    loaded = true;
    loader.classList.add('hide');
    setTimeout(function () { loader.style.display = 'none'; }, 350);
  });

  // Kalau gagal terhubung dalam batas waktu, coba lagi otomatis (reload halaman)
  setTimeout(function () {
    if (!loaded) {
      loaderText.textContent = 'Menghubungkan ulang...';
      setTimeout(function () { window.location.reload(); }, 600);
    }
  }, TIMEOUT_MS);

  // ================= IKON APLIKASI (favicon & "Add to Home Screen") =================
  // GET biasa (bukan POST) — dijamin tidak kena masalah CORS preflight sama
  // sekali. Endpoint ?rpc=getIkon cuma mengembalikan JSON kecil berisi URL
  // Icon Aplikasi terbaru (bukan file gambar), lihat doGet di Code.gs.
  fetch(GAS_WEB_APP_URL + '?rpc=getIkon')
    .then(function (r) { return r.json(); })
    .then(function (res) {
      var url = res && res.url;
      if (!url) return; // belum ada ikon custom diupload — biarkan ikon bawaan browser

      document.getElementById('appFaviconLink').setAttribute('href', url);
      document.getElementById('appTouchIconLink').setAttribute('href', url);

      // Web App Manifest dibuat dinamis lewat Blob URL (bukan file
      // manifest.json terpisah) — supaya ikon "Add to Home Screen"/"Install
      // App" di Android Chrome & desktop Chrome ikut memakai ikon terbaru.
      var manifest = {
        name: 'Sistem Administrasi NU Baleharjo',
        short_name: 'SI ADMIN NU',
        start_url: GAS_WEB_APP_URL,
        display: 'standalone',
        background_color: '#0f3d24',
        theme_color: '#0f3d24',
        icons: [
          { src: url, sizes: '192x192', type: 'image/png' },
          { src: url, sizes: '512x512', type: 'image/png' }
        ]
      };
      var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      document.getElementById('appManifestLink').setAttribute('href', URL.createObjectURL(blob));
    })
    .catch(function () {
      // Diam-diam gagal (mis. offline) — biarkan ikon bawaan browser, jangan
      // sampai mengganggu iframe utama yang tetap harus tampil.
    });
</script>

</body>
</html>
